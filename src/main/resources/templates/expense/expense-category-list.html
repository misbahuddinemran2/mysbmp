<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Categories | StockFlow ERP</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>

<body>
<div class="app-shell">

  <div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
  <div th:replace="~{dashboard/fragments/sidebar :: sidebar-overlay}"></div>

  <div class="main-area" id="mainArea">
    <div th:replace="~{dashboard/fragments/topbar :: topbar}"></div>

    <main class="page-content" role="main">

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Expense Categories</h1>
          <p class="page-subtitle">
            <a th:href="@{/expenses}" style="color:var(--primary);text-decoration:none;">
              <i class="bi bi-arrow-left"></i> Back to Expenses
            </a>
          </p>
        </div>
        <button type="button" class="btn-sm-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
          <i class="bi bi-plus-lg"></i> Add Category
        </button>
      </div>

      <div class="section-card">
        <div class="section-card-header">
          <div class="section-card-title"><i class="bi bi-tags"></i> All Categories</div>
        </div>
        <div class="section-card-body">

          <div th:if="${categories == null or categories.isEmpty()}"
               class="text-center py-4 text-muted">
            <i class="bi bi-tags" style="font-size:2rem;"></i>
            <p class="mt-2 mb-0" style="font-size:0.9rem;">No categories yet. Add one to get started.</p>
          </div>

          <div class="table-responsive-wrapper" th:unless="${categories == null or categories.isEmpty()}">
            <table class="data-table">
              <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="cat : ${categories}">
                <td><span class="fw-600" th:text="${cat.name}">—</span></td>
                <td><span class="color-muted" th:text="${cat.description ?: '—'}">—</span></td>
                <td>
                  <span th:classappend="${cat.active} ? 'paid' : 'failed'"
                        class="badge-status" th:text="${cat.active} ? 'Active' : 'Inactive'">—</span>
                </td>
                <td>
                  <form th:action="@{/expenses/categories/{id}/toggle(id=${cat.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn-sm-outline">
                      <i class="bi" th:classappend="${cat.active} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                      <span th:text="${cat.active} ? 'Deactivate' : 'Activate'"></span>
                    </button>
                  </form>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" th:action="@{/expenses/categories/add}" th:object="${newCategory}">

        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Category Name</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Shop Rent" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description (Optional)</label>
            <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-sm-primary">
            <i class="bi bi-check-circle"></i> Save Category
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
