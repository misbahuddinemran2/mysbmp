<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses | StockFlow ERP</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>

<body>
<div class="app-shell">

  <div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
  <div th:replace="~{dashboard/fragments/sidebar :: sidebar-overlay}"></div>

  <div class="main-area" id="mainArea">
    <div th:replace="~{dashboard/fragments/topbar :: topbar}"></div>

    <main class="page-content" role="main">

      <div th:if="${successMessage}"
           class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMessage}"
           class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Expenses</h1>
          <p class="page-subtitle">Track and manage your business expenses</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <a th:href="@{/expenses/categories}" class="btn-sm-outline" style="text-decoration:none;">
            <i class="bi bi-tags"></i> Manage Categories
          </a>
          <button type="button" class="btn-sm-primary" data-bs-toggle="modal" data-bs-target="#addExpenseModal">
            <i class="bi bi-plus-lg"></i> Add Expense
          </button>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="row g-3 mb-4">

        <div class="col-12 col-sm-6 col-xl-4">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon red"><i class="bi bi-wallet2"></i></div>
            </div>
            <div>
              <div class="stat-card-value"
                   th:text="'৳ ' + ${#numbers.formatInteger(totalExpense ?: 0, 1, 'COMMA')}">৳ 0</div>
              <div class="stat-card-label">Total Expense (All time)</div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-xl-4">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon warning"><i class="bi bi-calendar3"></i></div>
            </div>
            <div>
              <div class="stat-card-value"
                   th:text="'৳ ' + ${#numbers.formatInteger(totalExpenseThisMonth ?: 0, 1, 'COMMA')}">৳ 0</div>
              <div class="stat-card-label">This Month's Expense</div>
            </div>
          </div>
        </div>

      </div>

      <!-- Expense List -->
      <div class="section-card">
        <div class="section-card-header">
          <div class="section-card-title"><i class="bi bi-receipt-cutoff"></i> All Expenses</div>
        </div>
        <div class="section-card-body">

          <div th:if="${expensePage == null or expensePage.isEmpty()}"
               class="text-center py-4 text-muted">
            <i class="bi bi-wallet2" style="font-size:2rem;"></i>
            <p class="mt-2 mb-0" style="font-size:0.9rem;">No expenses recorded yet.</p>
          </div>

          <div class="table-responsive-wrapper" th:unless="${expensePage == null or expensePage.isEmpty()}">
            <table class="data-table">
              <thead>
              <tr>
                <th>Date</th>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Payment Method</th>
                <th>Recorded By</th>
                <th>Action</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="exp : ${expensePage.content}">
                <td th:text="${#temporals.format(exp.expenseDate, 'dd MMM yyyy')}">—</td>
                <td><span class="fw-600" th:text="${exp.title}">—</span></td>
                <td><span class="badge-status pending" th:text="${exp.categoryName}">—</span></td>
                <td><span class="amount-cell" style="color:var(--danger);"
                          th:text="'৳ ' + ${#numbers.formatInteger(exp.amount ?: 0, 1, 'COMMA')}">৳ 0</span></td>
                <td><span class="color-muted" th:text="${exp.paymentMethod}">—</span></td>
                <td><span class="color-muted" th:text="${exp.recordedByName}">—</span></td>
                <td>
                  <form th:action="@{/expenses/{id}/delete(id=${exp.id})}" method="post"
                        onsubmit="return confirm('Delete this expense?');" style="display:inline;">
                    <button type="submit" class="btn-sm-outline" style="color:var(--danger);border-color:var(--danger);">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div th:if="${expensePage != null and expensePage.totalPages > 1}"
               class="d-flex justify-content-center gap-2 mt-3">
            <a th:each="i : ${#numbers.sequence(0, expensePage.totalPages - 1)}"
               th:href="@{/expenses(page=${i})}"
               th:classappend="${i == expensePage.number} ? 'btn-sm-primary' : 'btn-sm-outline'"
               style="text-decoration:none;min-width:34px;text-align:center;"
               th:text="${i + 1}">1</a>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add Expense Modal -->
<div class="modal fade" id="addExpenseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" th:action="@{/expenses/add}" th:object="${newExpense}">

        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Add Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label">Category</label>
            <select th:field="*{categoryId}" class="form-select" required>
              <option value="">-- Select Category --</option>
              <option th:each="cat : ${categories}"
                      th:value="${cat.id}"
                      th:text="${cat.name}"></option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Shop Rent — July" required>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">Amount</label>
              <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">Date</label>
              <input type="date" th:field="*{expenseDate}" class="form-control" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select th:field="*{paymentMethod}" class="form-select" required>
              <option value="CASH">Cash</option>
              <option value="BANK">Bank Transfer</option>
              <option value="CARD">Card</option>
              <option value="BKASH">bKash</option>
              <option value="NAGAD">Nagad</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Reference No. (Optional)</label>
            <input type="text" th:field="*{referenceNo}" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Description (Optional)</label>
            <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-sm-primary">
            <i class="bi bi-check-circle"></i> Save Expense
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
