<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Due Details | StockFlow ERP</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>

<body>
<div class="app-shell">

    <div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{dashboard/fragments/sidebar :: sidebar-overlay}"></div>

    <div class="main-area" id="mainArea">
        <div th:replace="~{dashboard/fragments/topbar :: topbar}"></div>

        <main class="page-content" role="main">

            <div th:if="${successMessage}"
                 class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}"
                 class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Page Header -->
            <div class="page-header">
                <div>
                    <h1 class="page-title">Due Invoices</h1>
                    <p class="page-subtitle">
                        <a th:href="@{/due-management}" style="color:var(--primary);text-decoration:none;">
                            <i class="bi bi-arrow-left"></i> Back to Due Management
                        </a>
                    </p>
                </div>
            </div>

            <div class="section-card">
                <div class="section-card-header">
                    <div class="section-card-title"><i class="bi bi-receipt"></i> Outstanding Invoices</div>
                </div>
                <div class="section-card-body">

                    <div th:if="${dueSales == null or dueSales.isEmpty()}"
                         class="text-center py-4 text-muted">
                        <i class="bi bi-emoji-smile" style="font-size:2rem;"></i>
                        <p class="mt-2 mb-0" style="font-size:0.9rem;">No due invoices for this customer.</p>
                    </div>

                    <div class="table-responsive-wrapper" th:unless="${dueSales == null or dueSales.isEmpty()}">
                        <table class="data-table">
                            <thead>
                            <tr>
                                <th>Invoice</th>
                                <th>Sale Date</th>
                                <th>Grand Total</th>
                                <th>Paid</th>
                                <th>Due</th>
                                <th>Days Overdue</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="ds : ${dueSales}">
                                <td><span class="fw-600" th:text="${ds.invoiceNo}">—</span></td>
                                <td th:text="${#temporals.format(ds.saleDate, 'dd MMM yyyy')}">—</td>
                                <td><span class="amount-cell" th:text="'৳ ' + ${#numbers.formatInteger(ds.grandTotal ?: 0, 1, 'COMMA')}">৳ 0</span></td>
                                <td><span style="color:var(--success);" th:text="'৳ ' + ${#numbers.formatInteger(ds.paidAmount ?: 0, 1, 'COMMA')}">৳ 0</span></td>
                                <td><span style="color:var(--danger);font-weight:600;" th:text="'৳ ' + ${#numbers.formatInteger(ds.dueAmount ?: 0, 1, 'COMMA')}">৳ 0</span></td>
                                <td>
                  <span th:classappend="${ds.daysOverdue > 30} ? 'critical' : 'low'"
                        class="stock-badge"
                        th:text="${ds.daysOverdue} + ' days'">0 days</span>
                                </td>
                                <td>
                                    <button type="button"
                                            class="btn-sm-primary"
                                            data-bs-toggle="modal"
                                            th:attr="data-bs-target='#collectModal' + ${ds.saleId}">
                                        <i class="bi bi-cash"></i> Collect
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

            <!-- Collect Payment Modals (একটা করে প্রতিটা due invoice-এর জন্য) -->
            <div th:each="ds : ${dueSales}"
                 class="modal fade"
                 th:id="'collectModal' + ${ds.saleId}"
                 tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form method="post" th:action="@{/due-management/collect}">

                            <div class="modal-header">
                                <h5 class="modal-title">
                                    Collect Payment — <span th:text="${ds.invoiceNo}"></span>
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">

                                <input type="hidden" name="saleId" th:value="${ds.saleId}">

                                <div class="mb-3">
                                    <label class="form-label">Due Amount</label>
                                    <input type="text" class="form-control" disabled
                                           th:value="'৳ ' + ${#numbers.formatInteger(ds.dueAmount ?: 0, 1, 'COMMA')}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Amount to Collect</label>
                                    <input type="number" step="0.01" name="amount" class="form-control"
                                           th:max="${ds.dueAmount}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Payment Method</label>
                                    <select name="paymentMethod" class="form-select" required>
                                        <option value="CASH">Cash</option>
                                        <option value="BANK">Bank Transfer</option>
                                        <option value="CARD">Card</option>
                                        <option value="BKASH">bKash</option>
                                        <option value="NAGAD">Nagad</option>
                                        <option value="OTHER">Other</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Reference No. (Optional)</label>
                                    <input type="text" name="referenceNo" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Notes (Optional)</label>
                                    <textarea name="notes" class="form-control" rows="2"></textarea>
                                </div>

                            </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn-sm-primary">
                                    <i class="bi bi-check-circle"></i> Confirm Collection
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
