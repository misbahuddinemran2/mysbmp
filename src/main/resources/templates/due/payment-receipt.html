<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Receipt | StockFlow ERP</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body { background:#f1f3f5; font-family:'DM Sans', sans-serif; }
        .receipt-wrapper { max-width:480px; margin:40px auto; }
        .receipt-box {
          background:#fff; border-radius:10px; padding:32px;
          box-shadow:0 4px 18px rgba(0,0,0,0.08);
        }
        .receipt-header { text-align:center; border-bottom:2px dashed #ddd; padding-bottom:16px; margin-bottom:16px; }
        .receipt-header h4 { margin:0; font-weight:800; }
        .receipt-header p { margin:2px 0 0; font-size:0.8rem; color:#888; }
        .receipt-row { display:flex; justify-content:space-between; padding:6px 0; font-size:0.88rem; }
        .receipt-row span:first-child { color:#888; }
        .receipt-row span:last-child { font-weight:600; }
        .receipt-total {
          background:#f8f9fa; border-radius:8px; padding:14px; margin:16px 0;
          display:flex; justify-content:space-between; align-items:center;
        }
        .receipt-total .amount { font-size:1.4rem; font-weight:800; color:#1baf7a; }
        .receipt-footer { text-align:center; margin-top:20px; font-size:0.75rem; color:#aaa; }
        .no-print { margin-top:20px; text-align:center; }
        @media print {
          .no-print { display:none; }
          body { background:#fff; }
          .receipt-box { box-shadow:none; }
        }
    </style>
</head>
<body>

<div class="receipt-wrapper">
    <div class="receipt-box" id="receiptContent">

        <div class="receipt-header">
            <h4 th:text="${receipt.businessName}">Business Name</h4>
            <p th:text="${receipt.businessAddress}">Address</p>
            <p style="margin-top:8px;font-weight:700;color:#333;">PAYMENT RECEIPT</p>
        </div>

        <div class="receipt-row">
            <span>Receipt No.</span>
            <span th:text="${receipt.receiptNo}">RCPT-000001</span>
        </div>
        <div class="receipt-row">
            <span>Date</span>
            <span th:text="${#temporals.format(receipt.paymentDate, 'dd MMM yyyy')}">—</span>
        </div>
        <div class="receipt-row">
            <span>Customer</span>
            <span th:text="${receipt.customerName}">—</span>
        </div>
        <div class="receipt-row" th:if="${receipt.customerMobile}">
            <span>Mobile</span>
            <span th:text="${receipt.customerMobile}">—</span>
        </div>
        <div class="receipt-row">
            <span>Against Invoice</span>
            <span th:text="${receipt.invoiceNo}">—</span>
        </div>
        <div class="receipt-row">
            <span>Payment Method</span>
            <span th:text="${receipt.paymentMethod}">—</span>
        </div>
        <div class="receipt-row" th:if="${receipt.referenceNo}">
            <span>Reference No.</span>
            <span th:text="${receipt.referenceNo}">—</span>
        </div>

        <div class="receipt-total">
            <span>Amount Collected</span>
            <span class="amount" th:text="'৳ ' + ${#numbers.formatDecimal(receipt.amountPaidNow, 1, 'COMMA', 2, 'POINT')}">৳ 0</span>
        </div>

        <div class="receipt-row">
            <span>Invoice Total</span>
            <span th:text="'৳ ' + ${#numbers.formatDecimal(receipt.grandTotal, 1, 'COMMA', 2, 'POINT')}">৳ 0</span>
        </div>
        <div class="receipt-row">
            <span>Total Paid So Far</span>
            <span style="color:var(--success,#1baf7a);" th:text="'৳ ' + ${#numbers.formatDecimal(receipt.totalPaidSoFar, 1, 'COMMA', 2, 'POINT')}">৳ 0</span>
        </div>
        <div class="receipt-row">
            <span>Remaining Due</span>
            <span th:style="${receipt.remainingDue.doubleValue() > 0} ? 'color:#dc3545;' : 'color:#1baf7a;'"
                  th:text="'৳ ' + ${#numbers.formatDecimal(receipt.remainingDue, 1, 'COMMA', 2, 'POINT')}">৳ 0</span>
        </div>

        <div th:if="${receipt.notes}" style="margin-top:12px;font-size:0.8rem;color:#888;">
            <strong>Notes:</strong> <span th:text="${receipt.notes}"></span>
        </div>

        <div class="receipt-footer">
            Issued on <span th:text="${#temporals.format(receipt.issuedAt, 'dd MMM yyyy, hh:mm a')}"></span><br>
            Thank you for your payment!
        </div>

    </div>

    <div class="no-print">
        <button class="btn btn-primary" onclick="window.print()">
            <i class="bi bi-printer"></i> Print Receipt
        </button>
        <a th:href="@{/due-management}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Due Management
        </a>
    </div>

</div>

</body>
</html>
