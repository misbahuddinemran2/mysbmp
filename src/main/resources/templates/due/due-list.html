<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Due Management | StockFlow ERP</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>

<body>
<div class="app-shell">

  <div th:replace="~{dashboard/fragments/sidebar :: sidebar}"></div>
  <div th:replace="~{dashboard/fragments/sidebar :: sidebar-overlay}"></div>

  <div class="main-area" id="mainArea">
    <div th:replace="~{dashboard/fragments/topbar :: topbar}"></div>

    <main class="page-content" role="main">

      <!-- Flash Messages -->
      <div th:if="${successMessage}"
           class="alert alert-success alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${errorMessage}"
           class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <!-- Page Header -->
      <div class="page-header">
        <div>
          <h1 class="page-title">Due Management</h1>
          <p class="page-subtitle">Track and collect outstanding customer dues</p>
        </div>
      </div>

      <!-- KPI Cards -->
      <div class="row g-3 mb-4">

        <div class="col-12 col-sm-6 col-xl-4">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon red"><i class="bi bi-exclamation-triangle"></i></div>
            </div>
            <div>
              <div class="stat-card-value"
                   th:text="'৳ ' + ${#numbers.formatInteger(totalDue ?: 0, 1, 'COMMA')}">৳ 0</div>
              <div class="stat-card-label">Total Outstanding Due</div>
            </div>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-xl-4">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon warning"><i class="bi bi-people"></i></div>
            </div>
            <div>
              <div class="stat-card-value" th:text="${customerDues != null ? #lists.size(customerDues) : 0}">0</div>
              <div class="stat-card-label">Customers with Due</div>
            </div>
          </div>
        </div>

      </div>

      <!-- Customer Due List -->
      <div class="section-card">
        <div class="section-card-header">
          <div class="section-card-title"><i class="bi bi-cash-coin"></i> Customer-wise Due</div>
        </div>
        <div class="section-card-body">

          <div th:if="${customerDues == null or customerDues.isEmpty()}"
               class="text-center py-4 text-muted">
            <i class="bi bi-emoji-smile" style="font-size:2rem;"></i>
            <p class="mt-2 mb-0" style="font-size:0.9rem;">No outstanding dues. All customers are settled up!</p>
          </div>

          <div class="table-responsive-wrapper" th:unless="${customerDues == null or customerDues.isEmpty()}">
            <table class="data-table">
              <thead>
              <tr>
                <th>Customer</th>
                <th>Phone</th>
                <th>Due Invoices</th>
                <th>Total Due</th>
                <th>Action</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="cd : ${customerDues}">
                <td>
                  <div class="customer-cell">
                    <div class="customer-avatar"
                         th:text="${cd.customerName != null and #strings.length(cd.customerName) >= 2}
                                   ? ${#strings.toUpperCase(#strings.substring(cd.customerName, 0, 2))}
                                   : 'CU'">CU</div>
                    <div>
                      <div class="customer-name" th:text="${cd.customerName ?: '—'}">—</div>
                    </div>
                  </div>
                </td>
                <td><span class="color-muted" th:text="${cd.customerPhone ?: '—'}">—</span></td>
                <td>
                  <span class="badge-status pending" th:text="${cd.dueInvoiceCount} + ' invoice(s)'">0</span>
                </td>
                <td>
                  <span class="amount-cell" style="color:var(--danger);"
                        th:text="'৳ ' + ${#numbers.formatInteger(cd.totalDue ?: 0, 1, 'COMMA')}">৳ 0</span>
                </td>
                <td>
                  <a th:href="@{/due-management/customer/{id}(id=${cd.customerId})}"
                     class="btn-sm-primary"
                     style="text-decoration:none;">
                    <i class="bi bi-cash-coin"></i> View &amp; Collect
                  </a>
                </td>
              </tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
