# =============================================
# DEV PROFILE - Neon PostgreSQL
# =============================================

# Server
server.port=9090

# Database - Neon PostgreSQL
spring.datasource.name=sbmp
spring.datasource.url=jdbc:postgresql://<আপনার-neon-host>/<আপনার-db-name>?sslmode=require
spring.datasource.username=<আপনার-neon-user>
spring.datasource.password=<আপনার-neon-password>
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# Thymeleaf / Spring
spring.thymeleaf.cache=false
spring.main.allow-circular-references=true

# File storage
upload.dir=uploads
user.activity.log.dir=user_activity_logs
