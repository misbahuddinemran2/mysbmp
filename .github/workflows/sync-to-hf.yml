name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Git LFS
        run: |
          git lfs install
          git lfs track "*.png"
          git lfs track "*.jpg"
          git lfs track "*.jpeg"
          git add .gitattributes
          git commit -m "Track binary files with LFS" || true
      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push -f https://sbmp:$HF_TOKEN@huggingface.co/spaces/sbmp/mysbmp main:main
