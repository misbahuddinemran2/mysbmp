name: Sync to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate binary files to Git LFS
        run: |
          git lfs install
          git lfs migrate import --include="*.png,*.jpg,*.jpeg" --everything
      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push -f https://sbmp:$HF_TOKEN@huggingface.co/spaces/sbmp/mysbmp main:main
